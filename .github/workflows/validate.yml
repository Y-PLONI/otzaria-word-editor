# אימות התוסף מול הולידטור הרשמי של אוצריא, בכל PR.
#
# למה בנפרד מ-release.yml: זה רץ על `push` ל-main בלבד, כלומר אחרי
# שהשינוי כבר נכנס. שער ההתקנה של אוצריא ושל החנות מופעל בדיוק על
# מה ש-PR משנה — מניפסט, הרשאות, הפניות לנכסים — ולכן המקום לבדוק הוא כאן.
#
# הוולידטור מושך את `spec.json` החי מ-Otzaria/otzaria@dev — ארטיפקט שמיוצר מקוד
# ה-Dart של האפליקציה — ולכן API או הרשאה שאוצריא שינתה מורגשת כאן בלי לעדכן דבר.
# נפילת האחזור אינה מכשילה: ה-action נופל לעותק המצורף בו, שהוא אותו ארטיפקט.
name: Validate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  # להערת הסיכום על ה-PR. ב-PR מ-fork הטוקן לקריאה בלבד והפרסום מדולג
  # באזהרה — הבדיקה עצמה רצה בכל מקרה, והתוצאה נכתבת ל-job summary.
  pull-requests: write

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: אימות התוסף
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # מ-.nvmrc, כדי ש-CI והמפתחים ירוצו על אותה גרסה. ה-webstorage של
          # Node 22+ מטופל בסביבת הבדיקות ואינו הסיבה לנעילה כאן.
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # `npm test` חוסם ב-release.yml, כלומר רק אחרי שהשינוי כבר ב-main.
      # בלעדיו כאן, PR ששובר את חבילת הטסטים עובר ירוק ומפיל את ה-Release.
      - name: Test
        run: npm test

      # הוולידטור בודק את מה שנארז בפועל, ולכן הוא דורש בנייה: מניפסט
      # תקין ב-public לא מוכיח שהנכסים שה-HTML מפנה אליהם נמצאים בארכיון.
      - name: Build (Vite -> dist)
        run: npm run build

      - name: Check dist
        run: npm run check:dist

      # Ghost text and Tab acceptance depend on the real DOCX engine and keyup
      # timing. Exercise the packaged app, including both shared fallback paths.
      - name: Browser completion regressions
        timeout-minutes: 5
        env:
          CHROME: /usr/bin/google-chrome
          # Node 20 exposes CDP's global WebSocket behind this flag. run-all
          # starts child Node processes, which inherit NODE_OPTIONS.
          NODE_OPTIONS: --experimental-websocket
        run: >-
          node scripts/qa/run-all.mjs
          scripts/qa/book-completion-qa.mjs
          scripts/qa/acronym-completion-qa.mjs
          scripts/qa/static-completion-qa.mjs

      # Caret endpoints and goal columns depend on the real painted layout.
      # Run the vertical navigation gate against the packaged DOCX engine.
      - name: Browser vertical caret regressions
        timeout-minutes: 10
        env:
          CHROME: /usr/bin/google-chrome
          NODE_OPTIONS: --experimental-websocket
        run: node scripts/qa/run-all.mjs scripts/qa/rtl-vertical-caret-qa.mjs

      # `fail-on-warnings: true` משקף את החנות, שחוסמת גם על אזהרות. dist עובר
      # ב-0 אזהרות, ולכן זה שער אמיתי ולא רעש.
      #
      # `pr-comment: 'true'` מפרסם את הטבלה ישירות ב-PR מאותו מאגר; ב-PR
      # מ-fork הטוקן לקריאה בלבד (מגבלת GitHub) והפרסום מדולג באזהרה — את
      # החסר משלימים שלושת הצעדים הבאים יחד עם validate-comment.yml.
      - name: Validate dist against the live SDK spec
        id: validate
        uses: Otzaria/otzaria-plugin-validator@v1
        with:
          path: dist
          publish: 'false'
          fail-on-warnings: 'true'
          pr-comment: 'true'
          github-token: ${{ github.token }}

      # לכידת טבלת התוצאות בשביל תגובת ה-PR (validate-comment.yml).
      #
      # למה הרצה שנייה של קוד הוולידטור ולא לכידת הסיכום של הצעד שמעליו:
      # ה-runner דורס `GITHUB_STEP_SUMMARY` שמוגדר ב-`env:` של צעד (נמדד —
      # ריצה 33570628126: ה-env הוצג בלוג אבל הקובץ לא נוצר), ואין דרך
      # מתועדת לקרוא את הסיכום של צעד אחר. לכן אותו קוד בדיוק, באותו tag
      # (v1), רץ שוב עם `GITHUB_STEP_SUMMARY` שנקבע ברמת ה-shell — שם איש
      # אינו דורס — וכותב את אותה טבלה לקובץ שלנו. ההרצה זולה (נמדד: פחות
      # משנייה, כולל אחזור ה-spec), ואינה שער: `|| true`, כי הצעד שמעליו
      # כבר הכשיל את ה-job אם יש מה להכשיל — כאן רק נלכדת הטבלה, שדווקא
      # בריצה שנכשלה היא החשובה ביותר על ה-PR. מכאן גם `!cancelled()` ולא
      # `success()`: הלכידה רצה גם אחרי כשל אימות, אבל לא כשה-build עצמו
      # לא רץ (`outcome == 'skipped'`) — אז אין dist ואין מה למדוד.
      - name: Checkout the validator for the summary capture
        if: ${{ !cancelled() && github.event_name == 'pull_request' && steps.validate.outcome != 'skipped' }}
        uses: actions/checkout@v4
        with:
          repository: Otzaria/otzaria-plugin-validator
          ref: v1
          path: .validator

      - name: Capture the validator summary for the PR comment
        if: ${{ !cancelled() && github.event_name == 'pull_request' && steps.validate.outcome != 'skipped' }}
        run: |
          env 'INPUT_PATH=dist' 'INPUT_PUBLISH=false' 'INPUT_FAIL-ON-WARNINGS=true' \
            GITHUB_STEP_SUMMARY="${{ runner.temp }}/validator-summary.md" \
            node .validator/src/action.js || true

      - name: Hand the summary to the PR-comment workflow
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: validator-summary
          path: ${{ runner.temp }}/validator-summary.md
          if-no-files-found: ignore
          retention-days: 3
